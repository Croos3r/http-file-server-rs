[package]
name = "http-file-server-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
futures-util = "0.3.32"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full"] }
itertools = "0.14.0"
log = "0.4.29"
maud = "0.27.0"
mime_guess = "2.0.5"
multer = "3.1.0"
simple_logger = "5.2.0"
tokio = { version = "1.52.3", features = ["full"] }
