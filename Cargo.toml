[package]
name = "http-file-server-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full"] }
itertools = "0.14.0"
log = "0.4.29"
simple_logger = "5.2.0"
tokio = { version = "1.52.3", features = ["full"] }
